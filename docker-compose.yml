services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pediatricai-db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: pediatricai
      POSTGRES_USER: pediatricai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pediatricai_dev_2024}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pediatricai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: