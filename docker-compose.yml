services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pediatricai-db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: pediatricai
      POSTGRES_USER: pediatricai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pediatricai_dev_2024}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pediatricai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pediatricai-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pediatricai:${DB_PASSWORD:-pediatricai_dev_2024}@db:5432/pediatricai
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pediatricai-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: